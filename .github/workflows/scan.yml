name: FRVP Scanner

on:
  schedule:
    # Every minute is documented by GitHub as unreliable and can be silently
    # skipped for long stretches during high load. Every 5 minutes is well
    # within GitHub's supported range and runs reliably - still 3x faster
    # than the original 15-minute interval.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

# Prevents overlapping runs from racing on state.json: if a run is still
# going when the next minute ticks, the new one waits in queue instead of
# running in parallel and corrupting the committed state.
concurrency:
  group: frvp-scanner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install aiohttp

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Commit updated state
        run: |
          git config user.name "frvp-scanner-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --staged --quiet && exit 0
          git commit -m "Update scanner state [skip ci]"

          # Retry push with rebase: if another run's commit landed on the
          # remote in the meantime, pull it in and retry instead of failing
          # silently - a silent push failure is what causes the next run to
          # start from stale state and re-send an already-posted trade.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push failed (attempt $attempt), pulling and retrying..."
            git pull --rebase origin main
            sleep 2
          done

          echo "::error::Failed to push state.json after 5 attempts"
          exit 1
