name: FRVP Scanner

on:
  schedule:
    # Runs every minute. Trades themselves still only form on closed 15m
    # candles (the strategy logic is unchanged) - running every minute just
    # means a newly-closed candle is noticed and posted within ~60 seconds
    # instead of waiting up to 15 minutes for the next scheduled scan.
    - cron: "* * * * *"
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

# Prevents overlapping runs from racing on state.json: if a run is still
# going when the next minute ticks, the new one waits in queue instead of
# running in parallel and corrupting the committed state.
concurrency:
  group: frvp-scanner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install aiohttp

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Commit updated state
        run: |
          git config user.name "frvp-scanner-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update scanner state [skip ci]"
          git push
